<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hand Controlled Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #video-container {
            position: absolute; top: 20px; left: 20px; z-index: 2;
            width: 160px; height: 120px; border: 2px solid #00ffcc;
            border-radius: 8px; overflow: hidden; opacity: 0.8;
            transform: scaleX(-1); /* Mirror the webcam */
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #ui {
            position: absolute; top: 20px; right: 20px; z-index: 2;
            color: #00ffcc; text-align: right; pointer-events: none;
        }
        h1 { margin: 0; font-size: 24px; text-shadow: 0 0 10px #00ffcc; }
        p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
        .instruction { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="video-container"><video id="webcam" autoplay playsinline></video></div>
    
    <div id="ui">
        <h1>NEBULA HANDS</h1>
        <p>Current Shape: <span id="shape-name">Sphere</span></p>
        <p class="instruction">👆 Move Hand to Position</p>
        <p class="instruction">👌 Pinch to Expand/Contract</p>
        <p class="instruction">✊ Fist to Switch Shape</p>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- Configuration ---
        const PARTICLE_COUNT = 5000;
        const CAM_Z = 100;
        const FIST_THRESHOLD = 10; // Frames to hold fist before switching (prevents flickering)

        // --- State ---
        let currentShape = 'sphere';
        let targetPositions = []; 
        let particles, geometry, material;
        let handLandmarker;
        let video;
        let lastVideoTime = -1;
        let fistFrameCount = 0;
        
        // Interaction State
        const mouse = new THREE.Vector2();
        let expansionFactor = 1;
        let hueOffset = 0;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        // Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = CAM_Z;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- Particle System Init ---
        function initParticles() {
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            
            // Initial Random Positions
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 200;

                colors[i * 3] = 1;
                colors[i * 3 + 1] = 1;
                colors[i * 3 + 2] = 1;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Custom Shader Material for better control
            material = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Generate initial target positions (Sphere)
            generateShape('sphere');
        }

        // --- Shape Generators ---
        // Returns an array of [x, y, z] coordinates for a specific shape
        function getShapeData(type) {
            const data = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z;
                const idx = i * 3;

                if (type === 'sphere') {
                    const r = 40 * Math.cbrt(Math.random());
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } 
                else if (type === 'heart') {
                    // Heart formula
                    const t = Math.random() * Math.PI * 2;
                    const r = Math.sqrt(Math.random()) * 2; // Volume fill
                    
                    // Basic heart curve extended to 3D volume
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    
                    x = hx * r;
                    y = hy * r;
                    z = (Math.random() - 0.5) * 10 * r; // Thickness
                } 
                else if (type === 'saturn') {
                    // 70% Planet, 30% Rings
                    if (i < PARTICLE_COUNT * 0.7) {
                        const r = 25 * Math.sqrt(Math.random());
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    } else {
                        // Rings
                        const r = 35 + Math.random() * 20;
                        const theta = Math.random() * Math.PI * 2;
                        x = r * Math.cos(theta);
                        z = r * Math.sin(theta);
                        y = (Math.random() - 0.5) * 2; // Flat rings
                        
                        // Tilt the rings
                        const tilt = 0.4;
                        const ty = y * Math.cos(tilt) - z * Math.sin(tilt);
                        const tz = y * Math.sin(tilt) + z * Math.cos(tilt);
                        y = ty; z = tz;
                    }
                }
                else if (type === 'flower') {
                    // Rose curve / Flower
                    const rBase = 40;
                    const theta = Math.random() * Math.PI * 2;
                    const k = 4; // Petals
                    const r = Math.cos(k * theta) * rBase;
                    
                    x = r * Math.cos(theta) * (0.5 + Math.random()*0.5);
                    y = r * Math.sin(theta) * (0.5 + Math.random()*0.5);
                    z = (Math.random() - 0.5) * 10 + (Math.sin(r/5)*10); // Curvature
                }
                else if (type === 'fireworks') {
                    const r = Math.random() * 60;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    
                    // Bursts outward
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                    
                    // Add "trails" (random jitter)
                    x += (Math.random() - 0.5) * 5;
                }

                data[idx] = x;
                data[idx+1] = y;
                data[idx+2] = z;
            }
            return data;
        }

        function generateShape(shapeName) {
            currentShape = shapeName;
            document.getElementById('shape-name').innerText = shapeName.charAt(0).toUpperCase() + shapeName.slice(1);
            targetPositions = getShapeData(shapeName);
        }

        function cycleShape() {
            const shapes = ['sphere', 'heart', 'saturn', 'flower', 'fireworks'];
            const currentIndex = shapes.indexOf(currentShape);
            const nextIndex = (currentIndex + 1) % shapes.length;
            generateShape(shapes[nextIndex]);
        }

        // --- MediaPipe Setup ---
        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            startWebcam();
        }

        function startWebcam() {
            video = document.getElementById('webcam');
            navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener('loadeddata', predictWebcam);
            });
        }

        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime && handLandmarker) {
                lastVideoTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, performance.now());
                handleHandGestures(results);
            }
            requestAnimationFrame(predictWebcam);
        }

        function handleHandGestures(results) {
            if (results.landmarks && results.landmarks.length > 0) {
                const landmarks = results.landmarks[0];
                
                // 1. Position Tracking (Palm center roughly at index 9)
                // Normalize coordinates (0-1) to 3D space (-50 to 50)
                const x = (0.5 - landmarks[9].x) * 100; 
                const y = (0.5 - landmarks[9].y) * 80; 
                
                // Smoothly interpolate mouse/center position
                mouse.x += (x - mouse.x) * 0.1;
                mouse.y += (y - mouse.y) * 0.1;

                // 2. Pinch Detection (Distance between Thumb Tip [4] and Index Tip [8])
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                
                // Map distance to expansion: Closer = smaller (0.5), Farther = bigger (2.0)
                const targetScale = THREE.MathUtils.mapLinear(distance, 0.02, 0.2, 0.2, 5.0);
                expansionFactor += (targetScale - expansionFactor) * 0.1;

                // 3. Fist Detection (Cycle Shape)
                // Check if finger tips are below finger PIP joints (simple heuristic)
                const isFist = landmarks[8].y > landmarks[6].y && 
                               landmarks[12].y > landmarks[10].y && 
                               landmarks[16].y > landmarks[14].y;

                if (isFist) {
                    fistFrameCount++;
                    if (fistFrameCount === FIST_THRESHOLD) {
                        cycleShape();
                        // Flash UI
                        const ui = document.getElementById('ui');
                        ui.style.color = '#ff0055';
                        setTimeout(() => ui.style.color = '#00ffcc', 300);
                    }
                } else {
                    fistFrameCount = 0;
                }

                // 4. Color Mapping based on X position
                hueOffset = (landmarks[9].x) * 1.0; 

            } else {
                // Idle animation if no hand
                expansionFactor += (1 - expansionFactor) * 0.05;
                mouse.x += (0 - mouse.x) * 0.05;
                mouse.y += (0 - mouse.y) * 0.05;
            }
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const colors = particles.geometry.attributes.color.array;

                // Morphing Logic
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const idx = i * 3;

                    // Lerp position towards target shape
                    const tx = targetPositions[idx] * expansionFactor;
                    const ty = targetPositions[idx+1] * expansionFactor;
                    const tz = targetPositions[idx+2] * expansionFactor;

                    positions[idx] += (tx - positions[idx]) * 0.05; // Smooth transition speed
                    positions[idx+1] += (ty - positions[idx+1]) * 0.05;
                    positions[idx+2] += (tz - positions[idx+2]) * 0.05;

                    // Add some noise/life
                    positions[idx] += Math.sin(time + i) * 0.05;
                    positions[idx+1] += Math.cos(time + i * 0.5) * 0.05;

                    // Dynamic Color
                    const color = new THREE.Color();
                    // Hue based on hand position (hueOffset) + particle position
                    const h = (hueOffset + (i / PARTICLE_COUNT) * 0.2 + time * 0.05) % 1;
                    color.setHSL(0.6, 1.0, 0.5);
                    
                    colors[idx] = color.r;
                    colors[idx+1] = color.g;
                    colors[idx+2] = color.b;
                }

                particles.geometry.attributes.position.needsUpdate = true;
                particles.geometry.attributes.color.needsUpdate = true;

                // Follow hand
                particles.rotation.x += ((-mouse.y / 50) - particles.rotation.x) * 0.1;
                particles.rotation.y += ((mouse.x / 50) - particles.rotation.y) * 0.1;
            }

            renderer.render(scene, camera);
        }

        // --- Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Start ---
        initParticles();
        setupMediaPipe();
        animate();

    </script>
</body>
</html>
